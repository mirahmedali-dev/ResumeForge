<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Templates</title>
    <link rel="stylesheet" href="assets/css/templates.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>
    <main class="container">
        <div class="headings">
            <h1>Choose Your Resume Template</h1>
            <p>"Select a resume template to start building your professional resume in minutes."</p>
        </div>
        <div class="cardscontainer card1">
            <div class="cards" data-template="creative-minimalist">
                <div class="filter"></div>
                <img src="assets/images/temp1.png" alt="resume1">
                <h2>Creative Minimalist</h2>
                <p>Minimalist layout with a creative touch to highlight your skills.</p>
                <button class="choose-btn">Use This Template</button>
            </div>
            <div class="cards" data-template="modern-executive">
                <div class="filter"></div>

                <img src="assets/images/temp2.png" alt="resume1">
                <h2>Modern Professional</h2>
                <p>Modern format that highlights your experience with confidence.</p>
                <button class="choose-btn">Use This Template</button>
            </div>
            
        </div>
    </main>
    <div class="back">
        <div class="inner">
            <a href="index.html"><img src="assets/images/back-arrow-svgrepo-com.svg" alt="back"></a>
        </div>
    </div>
    <script src="assets/js/templatess.js"></script>
    
</body>

</html>
